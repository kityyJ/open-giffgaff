<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="简洁的 Giffgaff SIM 流量使用助手，可通过移动网络下载测试数据并保存本地记录。">
  <title>Giffgaff · 保号助手</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f5f7;
      --surface: #ffffff;
      --ink: #17191d;
      --secondary: #6b7079;
      --muted: #979ba3;
      --line: #e9ebef;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: max(25px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    }
    .topbar, .card-head, .metric-row, .history-head, .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar { min-height: 38px; gap: 12px; }
    .brand { display: inline-flex; align-items: center; color: var(--ink); min-width: 0; }
    .brand svg { display: block; width: 121px; height: auto; flex: none; }
    .topbar-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: none;
      border: 1px solid #e4e6ea;
      border-radius: 99px;
      padding: 7px 11px;
      background: #fff;
      color: #737780;
      font-size: 11px;
      font-weight: 550;
      letter-spacing: .1px;
      white-space: nowrap;
    }
    .topbar-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #848b95;
    }
    .intro { margin: 29px 1px 20px; }
    h1 { margin: 0; font-size: 27px; line-height: 1.35; letter-spacing: -.7px; font-weight: 740; }
    .intro-desc { margin: 7px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.6; }
    .dashboard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 13px; }

    .panel, .guide, .history {
      min-width: 0;
      border-radius: var(--radius);
    }
    .panel, .guide {
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 4px 18px rgba(15, 20, 30, .025);
    }
    .panel { padding: 22px; }
    .card-head { gap: 10px; margin-bottom: 16px; }
    .card-title { margin: 0; font-size: 14px; font-weight: 680; letter-spacing: -.1px; }
    .card-tag {
      flex: none;
      padding: 5px 9px;
      background: #f4f5f7;
      border-radius: 99px;
      color: #787e87;
      font-size: 11px;
    }
    .metric-row { align-items: flex-end; gap: 10px; }
    .metric-label { margin: 0 0 5px; font-size: 12px; color: var(--secondary); }
    .amount {
      margin: 0;
      font-size: clamp(38px, 9vw, 46px);
      line-height: 1.16;
      letter-spacing: -2px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .amount small { font-size: 16px; font-weight: 650; letter-spacing: 0; }
    .metric-note { padding-bottom: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .action-group { display: grid; gap: 10px; margin-top: 21px; }
    .primary-button, .topup-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 12px 17px;
      border-radius: 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.3;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .2s ease, border-color .2s ease;
    }
    .primary-button { border: 1px solid #17191d; color: #fff; background: #17191d; }
    .primary-button:hover:not(:disabled) { background: #35373c; }
    .primary-button:active:not(:disabled) { background: #000; }
    .primary-button:disabled { cursor: progress; background: #a6a9ae; border-color: #a6a9ae; }
    .topup-button {
      gap: 8px;
      min-height: 46px;
      border: 1px solid #e5e7eb;
      background: #f8f9fa;
      color: var(--ink);
      text-decoration: none;
    }
    .topup-button:hover { background: #f1f2f4; border-color: #d7dade; }
    .topup-button span { color: #858a92; font-size: 16px; font-weight: 400; }
    .primary-button:focus-visible, .topup-button:focus-visible {
      outline: 3px solid #abbccd;
      outline-offset: 3px;
    }
    .notice {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
      text-align: center;
    }
    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 15px;
      padding: 13px 14px;
      border: 1px solid #e9ebee;
      border-radius: 13px;
      background: #f6f7f8;
    }
    .status[hidden] { display: none; }
    .status-indicator { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: #9fa4ab; }
    .status.success .status-indicator { background: #228868; }
    .status.error .status-indicator { background: #ce4f53; }
    .status.loading .status-indicator { animation: breathe 1s ease-in-out infinite alternate; }
    .status-title { display: block; font-size: 13px; font-weight: 660; }
    .status-detail { margin: 5px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.5; }
    @keyframes breathe { to { opacity: .35; } }

    .guide { padding: 19px 21px 20px; }
    .guide-head { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; }
    .guide-mark { width: 25px; height: 25px; display: inline-grid; place-items: center; border-radius: 9px; background: #f1f2f4; font-size: 14px; color: #666c74; }
    .guide-title { margin: 0; font-size: 13px; font-weight: 670; }
    .steps { display: grid; gap: 11px; margin: 0; padding: 0; list-style: none; }
    .steps li { display: flex; align-items: flex-start; gap: 10px; color: var(--secondary); font-size: 12px; line-height: 1.6; }
    .step-index {
      display: inline-grid;
      flex: 0 0 20px;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 7px;
      background: #f1f2f4;
      color: #7b8189;
      font-size: 11px;
      font-weight: 650;
    }

    .history {
      padding: 20px 21px 15px;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
    }
    .history-head { gap: 12px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 15px; font-weight: 680; letter-spacing: -.1px; color: #fff; }
    .history-count {
      flex: none;
      padding: 5px 9px;
      border: 1px solid #292929;
      border-radius: 99px;
      color: #b8b8b8;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .history-item {
      min-height: 44px;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #272727;
      color: #b3b3b3;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .history-item::before {
      content: "";
      display: block;
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7fe5a1;
    }
    .history-item span:first-child { flex: 1; }
    .history-item:last-child { border-bottom: 0; }
    .history-item span:last-child { color: #ffffff; font-weight: 660; white-space: nowrap; }
    .empty { margin: 0; padding: 16px 0 9px; color: #999999; font-size: 12px; }
    .footer { margin: 20px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }

    @media (max-width: 380px) {
      .app { padding: max(20px, env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom)); }
      .panel, .guide, .history { border-radius: 20px; }
      .panel { padding: 19px; }
      .guide, .history { padding-inline: 18px; }
      .brand svg { width: 112px; }
      h1 { font-size: 25px; }
      .amount { font-size: 39px; }
      .topbar-label { font-size: 10px; padding: 6px 9px; }
    }
    @media (min-width: 720px) {
      .app { padding-top: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .primary-button, .topup-button { transition: none; }
      .status.loading .status-indicator { animation: none; }
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 32" role="img" aria-labelledby="giffgaff-title" xmlns="http://www.w3.org/2000/svg">
          <title id="giffgaff-title">giffgaff</title>

        </svg>
      </div>
      <span class="topbar-label">SIM 流量助手</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">保号助手</h1>
      <p class="intro-desc">少量数据下载测试，记录只保存在当前浏览器。</p>
    </section>

    <div class="dashboard">
      <section class="panel" aria-labelledby="task-title">
        <div class="card-head">
          <h2 class="card-title" id="task-title">流量下载</h2>
          <span class="card-tag">单次任务</span>
        </div>
        <div class="metric-row">
          <div>
            <p class="metric-label">预计下载量</p>
            <p class="amount">约 126 <small>KB</small></p>
          </div>
          <span class="metric-note">1 次请求</span>
        </div>
        <div class="action-group">
          <button class="primary-button" id="btn" type="button">开始下载</button>
          <a id="button_topup" class="topup-button" href="https://www.giffgaff.com/top-up" target="_blank" rel="noopener noreferrer" aria-label="Add credit，前往 giffgaff 官方充值页面">Add credit <span aria-hidden="true">↗</span></a>
        </div>
        <p class="notice">实际计费与保号状态请以 giffgaff 官方记录为准</p>
        <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true" hidden>
          <span class="status-indicator" aria-hidden="true"></span>
          <div>
            <strong class="status-title" id="statusTitle"></strong>
            <p class="status-detail" id="statusDetail"></p>
          </div>
        </div>
      </section>

      <section class="guide" aria-labelledby="guide-title">
        <div class="guide-head">
          <span class="guide-mark" aria-hidden="true">i</span>
          <h2 class="guide-title" id="guide-title">使用提示</h2>
        </div>
        <ol class="steps">
          <li><span class="step-index" aria-hidden="true">1</span><span>关闭 Wi-Fi，确认使用 giffgaff 移动数据。</span></li>
          <li><span class="step-index" aria-hidden="true">2</span><span>下载完成后关闭移动数据，避免额外消耗。</span></li>
        </ol>
      </section>

      <section class="history" aria-labelledby="history-title">
        <div class="history-head">
          <h2 id="history-title">操作日志</h2>
          <span class="history-count">本地 · 最近 5 条</span>
        </div>
        <div id="historyList"></div>
      </section>
    </div>
    <p class="footer">无需登录 · 本地保存记录 · 不收集个人信息</p>
  </main>
  <script>
    const historyKey = "ggHistory";
    const button = document.getElementById("btn");
    const statusBox = document.getElementById("status");
    const statusTitle = document.getElementById("statusTitle");
    const statusDetail = document.getElementById("statusDetail");
    const historyList = document.getElementById("historyList");

    function readHistory() {
      try {
        const records = JSON.parse(localStorage.getItem(historyKey) || "[]");
        return Array.isArray(records) ? records : [];
      } catch (_) {
        return [];
      }
    }

    function loadHistory() {
      historyList.replaceChildren();
      const records = readHistory().slice(-5).reverse();

      if (!records.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "暂无记录";
        historyList.appendChild(empty);
        return;
      }

      records.forEach(function (item) {
        const row = document.createElement("div");
        row.className = "history-item";
        const date = document.createElement("span");
        const size = document.createElement("span");
        date.textContent = String(item.date || "未知时间");
        size.textContent = String(item.size || "0") + " KB";
        row.append(date, size);
        historyList.appendChild(row);
      });
    }

    function saveHistory(size) {
      const now = new Date();
      const date = (now.getMonth() + 1) + "/" + now.getDate() + " " +
        now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
      const records = readHistory();
      records.push({ date: date, size: size, timestamp: now.getTime() });

      try {
        localStorage.setItem(historyKey, JSON.stringify(records.slice(-20)));
      } catch (_) {
        // 浏览器禁止本地存储时，不影响下载本身。
      }
      loadHistory();
    }

    function showStatus(type, title, detail) {
      statusBox.hidden = false;
      statusBox.className = "status " + type;
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
    }

    async function consumeData() {
      button.disabled = true;
      button.textContent = "正在下载…";
      showStatus("loading", "正在连接", "请保持移动网络连接");

      const url = new URL("payload.txt", window.location.href);
      url.searchParams.set("t", String(Date.now()));
      url.searchParams.set("r", Math.random().toString(36).slice(2));
      const startedAt = performance.now();

      try {
        const response = await fetch(url.toString(), {
          cache: "no-store",
          headers: {
            "Cache-Control": "no-cache, no-store, must-revalidate",
            "Pragma": "no-cache"
          }
        });
        if (!response.ok) throw new Error("服务器返回 HTTP " + response.status);
        const blob = await response.blob();
        if (blob.size === 0) throw new Error("服务器返回空文件");

        const size = (blob.size / 1024).toFixed(2);
        const seconds = ((performance.now() - startedAt) / 1000).toFixed(2);
        showStatus("success", "下载完成", "收到 " + size + " KB · 用时 " + seconds + " 秒");
        saveHistory(size);
        button.textContent = "再次下载";
      } catch (error) {
        showStatus("error", "下载失败", error.message || "请检查网络后重试");
        button.textContent = "重试下载";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", consumeData);
    loadHistory();
  </script>
</body>
</html>
